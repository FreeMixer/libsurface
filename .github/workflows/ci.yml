name: ci
# A push runs on main only; a pull request already runs its branch.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: build + test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A backstop only: every test carries its own timeout (tests/run-test.sh).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the public-sources gate reads every commit message
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Shared library
        run: make shared
      - name: Install, and build a consumer against the installed tree
        run: |
          make install PREFIX=/usr DESTDIR="$PWD/stage"
          cat > consumer.c <<'C'
          #include <surface/surface.h>
          int main(void)
          {
                  struct surface_geometry g;
                  return surface_geometry_preset(SURFACE_MODEL_CONTROL24, &g) == 0 && g.strips == 24 ? 0 : 1;
          }
          C
          PKG_CONFIG_SYSROOT_DIR="$PWD/stage" PKG_CONFIG_LIBDIR="$PWD/stage/usr/lib/pkgconfig" \
            sh -c 'cc consumer.c $(pkg-config --static --cflags --libs libsurface) -o consumer'
          ./consumer

  # The DigiNet module (libsurface-diginet, surface-c24) against libdiginet's main: the desk mux is
  # in no libdiginet release yet. The core above builds and tests without it.
  diginet:
    name: DigiNet module (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the public-sources gate reads every commit message
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: libdiginet, built from its main
        run: |
          git clone --depth 1 https://github.com/FreeMixer/libdiginet.git ../libdiginet
          make -C ../libdiginet libdiginet.a libdiginet-transport.a libdiginet-emu.a tools/diginet-packet-helper
      - name: Build, the module required
        run: make DIGINET_SRC=../libdiginet DIGINET=yes
      - name: Tests, the module's included
        run: make DIGINET_SRC=../libdiginet DIGINET=yes test
      - name: Shared libraries
        run: make DIGINET_SRC=../libdiginet DIGINET=yes shared

  # test_c24_tool needs a user and network namespace, which the containers above do not allow, so
  # it reports SKIP there. This job is where it runs: on the bare runner, once Ubuntu's AppArmor
  # limit is lifted, and a skip fails the job. SIBLING_BRANCH, when the workflow sets one, names the
  # libdiginet branch this run lands with.
  diginet-host:
    name: DigiNet module on the runner (test_c24_tool in a namespace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: libdiginet
        run: |
          git clone --depth 1 --branch "${SIBLING_BRANCH:-main}" https://github.com/FreeMixer/libdiginet.git ../libdiginet
          make -C ../libdiginet libdiginet.a libdiginet-transport.a libdiginet-emu.a tools/diginet-packet-helper
      - name: The module's tests
        run: make DIGINET_SRC=../libdiginet DIGINET=yes test-diginet 2>&1 | tee test.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: The end-to-end test ran
        run: "grep -q '^PASS: tests/diginet/test_c24_tool$' test.log"

  # The Mackie module (libsurface-mackie) against libmackie's main.
  mackie:
    name: Mackie module (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the public-sources gate reads every commit message
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: libmackie, built from its main
        run: |
          git clone --depth 1 https://github.com/FreeMixer/libmackie.git ../libmackie
          make -C ../libmackie libmackie.a
      - name: Build, the module required
        run: make MACKIE_SRC=../libmackie MACKIE=yes
      - name: Tests, the module's included
        run: make MACKIE_SRC=../libmackie MACKIE=yes test
      - name: Shared libraries
        run: make MACKIE_SRC=../libmackie MACKIE=yes shared
