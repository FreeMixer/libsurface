name: ci
# A push runs on main and dedupe/all only; a pull request already runs its branch.
on:
  push:
    branches: [main, dedupe/all]
  pull_request:
env:
  # the branch the modules' siblings (libdiginet, libmackie) are built from: a pull request into dedupe/all, or a push
  # to it, builds on their dedupe/all, the wave this one lands with; every other run on their main
  SIBLING_BRANCH: ${{ (github.base_ref == 'dedupe/all' || github.ref == 'refs/heads/dedupe/all') && 'dedupe/all' || 'main' }}
jobs:
  test:
    name: build + test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A backstop only: every test carries its own timeout (tests/run-test.sh).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Shared library
        run: make shared
      - name: Install, and build a consumer against the installed tree
        run: |
          make install PREFIX=/usr DESTDIR="$PWD/stage"
          cat > consumer.c <<'C'
          #include <surface/surface.h>
          int main(void)
          {
                  struct surface_geometry g;
                  return surface_geometry_preset(SURFACE_MODEL_CONTROL24, &g) == 0 && g.strips == 24 ? 0 : 1;
          }
          C
          PKG_CONFIG_SYSROOT_DIR="$PWD/stage" PKG_CONFIG_LIBDIR="$PWD/stage/usr/lib/pkgconfig" \
            sh -c 'cc consumer.c $(pkg-config --static --cflags --libs libsurface) -o consumer'
          ./consumer

  # The DigiNet module (libsurface-diginet, surface-c24) against libdiginet's main: the desk mux is
  # in no libdiginet release yet. The core above builds and tests without it.
  diginet:
    name: DigiNet module (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: libdiginet, built from its main (its dedupe/all on a dedupe/all run)
        run: |
          git clone --depth 1 --branch "$SIBLING_BRANCH" https://github.com/FreeMixer/libdiginet.git ../libdiginet
          make -C ../libdiginet libdiginet.a libdiginet-transport.a tools/diginet-packet-helper
      - name: Build, the module required
        run: make DIGINET_SRC=../libdiginet DIGINET=yes
      - name: Tests, the module's included
        run: make DIGINET_SRC=../libdiginet DIGINET=yes test
      - name: Shared libraries
        run: make DIGINET_SRC=../libdiginet DIGINET=yes shared

  # The Mackie module (libsurface-mackie) against libmackie's main.
  mackie:
    name: Mackie module (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: libmackie, built from its main (its dedupe/all on a dedupe/all run)
        run: |
          git clone --depth 1 --branch "$SIBLING_BRANCH" https://github.com/FreeMixer/libmackie.git ../libmackie
          make -C ../libmackie libmackie.a
      - name: Build, the module required
        run: make MACKIE_SRC=../libmackie MACKIE=yes
      - name: Tests, the module's included
        run: make MACKIE_SRC=../libmackie MACKIE=yes test
      - name: Shared libraries
        run: make MACKIE_SRC=../libmackie MACKIE=yes shared

  # the checks every FreeMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (FreeMixer/.github's public-sources-check)
  public-sources:
    uses: FreeMixer/.github/.github/workflows/public-sources-check.yml@v1
